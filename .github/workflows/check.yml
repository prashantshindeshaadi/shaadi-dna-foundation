name: Check foundation

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Aliases, descriptions, scopes, font files, 64 contrast pairings.
      # Exits non-zero on any failure.
      - name: Check tokens
        run: python3 shaadi-dna-foundation/tools/check.py

      - name: Build platform files
        run: python3 shaadi-dna-foundation/tools/build.py
