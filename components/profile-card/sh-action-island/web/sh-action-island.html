  sh-action-island — web (HTML5 + CSS). All 16 variants (8 Types × Style Normal / Floating), Show note on,
  plus Show note off.
  Spec: ../sh-action-island.md · Figma node 2594:16928
  Run `python3 tools/build.py` once so dist/ exists. The "photo" is a neutral placeholder. Normal has no surface:
  it is shown inside dark glass, as in sh-profile-card-info. Floating brings its own light surface.

  Markup (Figma property → HTML):
    Style       sh-action-island--normal | sh-action-island--floating
    Type        sh-action-island--message-primary | --message-premium | --message-tertiary | --message-only |
                --primary-only | --secondary-primary | --tertiary-primary | --three-actions
    Show note   an sh-action-note (same Style) as the first child; leave it out to hide it
    Message     .sh-action-island__message (sh-body-md-tight) before the button (Message + … types)
    Status      .sh-action-island__message alone (Message only)
    Buttons     sh-button Size Medium (--md) + --fill: Primary / Premium Solid / Tertiary beside a message,
                Primary alone (max 200, centred), Secondary or Tertiary + Primary side by side
    Three actions  3 × sh-icon-button-with-label (captions take the island's text colour)
-->
