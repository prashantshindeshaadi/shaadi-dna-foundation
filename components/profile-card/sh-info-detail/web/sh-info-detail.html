    h2 { margin: var(--sh-space-24) 0 var(--sh-space-8); }
    .preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--sh-space-16); max-width: 960px; }

    .surface { background: var(--sh-background-default); }
    .surface figcaption { color: var(--sh-text-secondary); }
    .pair { display: flex; gap: var(--sh-space-24); align-items: center; }
