<!--
  sh-profile-card — web (HTML5 + CSS). All 9 Types, built only from DNA components; open in a browser to preview.
  Spec: ../sh-profile-card.md · Figma node 2579:25592
  Run `python3 tools/build.py` once so dist/ exists. The member photo is a neutral placeholder (no member photos in the
  repo); No photo / Photo requested show the shipped requested portrait, full width and top-aligned.

  Markup: article.sh-profile-card[data-type]
    > .sh-photo-wrapper.sh-profile-card__photo  (sh-user-image + scrims + sh-overlay for No photo / Photo requested / With Overlay)
    > .sh-profile-card__top                      (sh-tag-profile at left; sh-icon-button Translucent Small: View photos, More options)
    > .sh-profile-card__info > section.sh-profile-card-info (see ../../sh-profile-card-info/web/sh-profile-card-info.html)
  What each Type shows follows the Figma variants: Post-Connect has no details or tags; Gated, No photo, Photo requested
  and Blocked have no trust badges; No photo / Photo requested have no top row; Blocked hides the photo count.
-->
