<!doctype html>
<!--
  sh-avatar — web (HTML5 + CSS). Every variant (Size × Type) plus the female glyph.
  Spec: ../sh-avatar.md · Figma node 2486:15378
  Run `python3 tools/build.py` once so dist/ exists.
  No member photos ship in the repo: the Image column uses the requested portrait as a stand-in photo.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sh-avatar</title>
  <link rel="stylesheet" href="../../../dist/css/tokens.css">
  <link rel="stylesheet" href="../../../dist/sh-typo-kit/developer/web/sh-typo.css">
  <link rel="stylesheet" href="../../sh-icon/web/sh-icon.css">
  <link rel="stylesheet" href="../../profile-card/sh-user-images/web/sh-user-images.css">
  <link rel="stylesheet" href="../../sh-avatar-glyph/web/sh-avatar-glyph.css">
  <link rel="stylesheet" href="sh-avatar.css">
  <style>
    body { margin: 0; padding: var(--sh-space-24) var(--sh-space-page-margin); background: var(--sh-background-soft); color: var(--sh-text-primary); font-family: var(--sh-typo-font-family-primary); }
    h2 { margin: var(--sh-space-24) 0 var(--sh-space-8); }
    .preview { display: grid; grid-template-columns: repeat(3, 180px); gap: var(--sh-space-16); }
    .cell { margin: 0; display: flex; flex-direction: column; gap: var(--sh-space-12); padding: var(--sh-space-16); border-radius: var(--sh-radius-card); background: var(--sh-background-default); }
    .cell figcaption { color: var(--sh-text-secondary); }
    .stage { display: flex; align-items: center; justify-content: center; height: calc(2 * var(--sh-space-48)); }
    .dark { background: var(--sh-background-inverse); }
    .dark figcaption { color: var(--sh-text-inverse); }
    .note { max-width: 760px; color: var(--sh-text-secondary); }
  </style>
</head>
<body>
  <h1 class="sh-heading-md">sh-avatar</h1>
  <p class="note sh-body-sm">Ring is icon/on-image (white), so it shows on photos and dark surfaces; on a white card it reads as a hairline gap. Media inside the ring, radius sh-radius/avatar.</p>

  <h2 class="sh-title-md">Size × Type</h2>
  <div class="preview">
    <!-- Size=sm -->
    <figure class="cell"><figcaption class="sh-support-label">Size=sm, Type=Image</figcaption>
      <div class="stage"><span class="sh-avatar sh-avatar--sm sh-avatar--image" role="img" aria-label="Sneha P"><span class="sh-avatar__media"><span class="sh-user-image"><img src="../../profile-card/sh-user-images/assets/requested-female.jpg" alt=""></span></span></span></div></figure>
    <figure class="cell"><figcaption class="sh-support-label">Size=sm, Type=Initial</figcaption>
      <div class="stage"><span class="sh-avatar sh-avatar--sm sh-avatar--initial"><span class="sh-avatar__media"><span class="sh-avatar__label sh-support-label">SH</span></span></span></div></figure>
    <figure class="cell"><figcaption class="sh-support-label">Size=sm, Type=Icon</figcaption>
      <div class="stage"><span class="sh-avatar sh-avatar--sm sh-avatar--icon" role="img" aria-label="No photo"><span class="sh-avatar__media"><span class="sh-avatar-glyph sh-avatar-glyph--male sh-avatar-glyph--16" aria-hidden="true"></span></span></span></div></figure>
    <!-- Size=md -->
    <figure class="cell"><figcaption class="sh-support-label">Size=md, Type=Image</figcaption>
      <div class="stage"><span class="sh-avatar sh-avatar--md sh-avatar--image" role="img" aria-label="Sneha P"><span class="sh-avatar__media"><span class="sh-user-image"><img src="../../profile-card/sh-user-images/assets/requested-female.jpg" alt=""></span></span></span></div></figure>
    <figure class="cell"><figcaption class="sh-support-label">Size=md, Type=Initial</figcaption>
      <div class="stage"><span class="sh-avatar sh-avatar--md sh-avatar--initial"><span class="sh-avatar__media"><span class="sh-avatar__label sh-body-md">SH</span></span></span></div></figure>
    <figure class="cell"><figcaption class="sh-support-label">Size=md, Type=Icon</figcaption>
      <div class="stage"><span class="sh-avatar sh-avatar--md sh-avatar--icon" role="img" aria-label="No photo"><span class="sh-avatar__media"><span class="sh-avatar-glyph sh-avatar-glyph--male sh-avatar-glyph--24" aria-hidden="true"></span></span></span></div></figure>
    <!-- Size=lg -->
    <figure class="cell"><figcaption class="sh-support-label">Size=lg, Type=Image</figcaption>
      <div class="stage"><span class="sh-avatar sh-avatar--lg sh-avatar--image" role="img" aria-label="Sneha P"><span class="sh-avatar__media"><span class="sh-user-image"><img src="../../profile-card/sh-user-images/assets/requested-female.jpg" alt=""></span></span></span></div></figure>
    <figure class="cell"><figcaption class="sh-support-label">Size=lg, Type=Initial</figcaption>
      <div class="stage"><span class="sh-avatar sh-avatar--lg sh-avatar--initial"><span class="sh-avatar__media"><span class="sh-avatar__label sh-heading-sm">SH</span></span></span></div></figure>
    <figure class="cell"><figcaption class="sh-support-label">Size=lg, Type=Icon</figcaption>
      <div class="stage"><span class="sh-avatar sh-avatar--lg sh-avatar--icon" role="img" aria-label="No photo"><span class="sh-avatar__media"><span class="sh-avatar-glyph sh-avatar-glyph--male sh-avatar-glyph--40" aria-hidden="true"></span></span></span></div></figure>
  </div>

  <h2 class="sh-title-md">Icon swap: female glyph · ring on a dark surface</h2>
  <div class="preview">
    <figure class="cell"><figcaption class="sh-support-label">Type=Icon, Icon=Female (sm · md)</figcaption>
      <div class="stage" style="gap: var(--sh-space-8)">
        <span class="sh-avatar sh-avatar--sm sh-avatar--icon" role="img" aria-label="No photo"><span class="sh-avatar__media"><span class="sh-avatar-glyph sh-avatar-glyph--female sh-avatar-glyph--16" aria-hidden="true"></span></span></span>
        <span class="sh-avatar sh-avatar--md sh-avatar--icon" role="img" aria-label="No photo"><span class="sh-avatar__media"><span class="sh-avatar-glyph sh-avatar-glyph--female sh-avatar-glyph--24" aria-hidden="true"></span></span></span>
      </div></figure>
    <figure class="cell"><figcaption class="sh-support-label">Size=lg, Type=Icon, Icon=Female</figcaption>
      <div class="stage"><span class="sh-avatar sh-avatar--lg sh-avatar--icon" role="img" aria-label="No photo"><span class="sh-avatar__media"><span class="sh-avatar-glyph sh-avatar-glyph--female sh-avatar-glyph--40" aria-hidden="true"></span></span></span></div></figure>
    <figure class="cell dark"><figcaption class="sh-support-label">Ring on background/inverse</figcaption>
      <div class="stage"><span class="sh-avatar sh-avatar--lg sh-avatar--image" role="img" aria-label="Sneha P"><span class="sh-avatar__media"><span class="sh-user-image"><img src="../../profile-card/sh-user-images/assets/requested-female.jpg" alt=""></span></span></span></div></figure>
  </div>
</body>
</html>
