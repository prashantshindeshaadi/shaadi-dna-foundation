<!doctype html>
<!--

-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sh-brand-footer</title>
  <link rel="stylesheet" href="../../../../dist/css/tokens.css">

<body>
  <h1 class="sh-heading-md">sh-brand-footer</h1>
  <div class="grid">
    <figure class="demo" style="width:360px"><figcaption class="sh-body-sm">Show story=true</figcaption><footer class="sh-brand-footer">
        <div class="sh-brand-footer__story-slot">
          <figure class="sh-brand-footer__story">

            <figcaption><span class="sh-brand-footer__couple sh-title-md">Radhika &amp; Yash</span><span class="sh-brand-footer__found sh-support-label">Found love on Shaadi</span></figcaption>
          </figure>
        </div>
        <p class="sh-brand-footer__tagline sh-heading-lg">Every <span class="sh-brand-footer__accent">Story</span><br>Begins Here</p>
        <hr class="sh-divider sh-divider--soft">
        <p class="sh-brand-footer__crafted sh-body-md">Crafted with <span class="sh-icon sh-icon--16 sh-brand-footer__heart" style="--icon:url(../../../../icons/filled/favourite.svg)" role="img" aria-label="love"></span> in <span lang="mr">आमची मुंबई</span></p>
      </footer></figure>
    <figure class="demo" style="width:360px"><figcaption class="sh-body-sm">Show story=false</figcaption><footer class="sh-brand-footer">
        
        <p class="sh-brand-footer__tagline sh-heading-lg">Every <span class="sh-brand-footer__accent">Story</span><br>Begins Here</p>
        <hr class="sh-divider sh-divider--soft">
        <p class="sh-brand-footer__crafted sh-body-md">Crafted with <span class="sh-icon sh-icon--16 sh-brand-footer__heart" style="--icon:url(../../../../icons/filled/favourite.svg)" role="img" aria-label="love"></span> in <span lang="mr">आमची मुंबई</span></p>
      </footer></figure>
  </div>

</html>
