<!doctype html>
<!--
  sh-fpv-requests — web (HTML5 + CSS). Every variant: Count=3 / 2 / 1 (the number of sh-request-card items).
  Spec: ../sh-fpv-requests.md
  Art not in the repo (the premium badge, the sh-graphic Art drawings) is left out: the badge slot shows a
  demo-only dashed outline; the overlays show their backdrop only.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sh-fpv-requests</title>
  <link rel="stylesheet" href="../../../../dist/css/tokens.css">
  <link rel="stylesheet" href="../../../../dist/sh-typo-kit/developer/web/sh-typo.css">
  <link rel="stylesheet" href="../../../../components/sh-icon/web/sh-icon.css">
  <link rel="stylesheet" href="../../../../components/sh-button/web/sh-button.css">
  <link rel="stylesheet" href="../../../../components/fpv/sh-fpv-asset-premium-badge/web/sh-fpv-asset-premium-badge.css">
  <link rel="stylesheet" href="../../../../components/fpv/sh-fpv-section-title/web/sh-fpv-section-title.css">
  <link rel="stylesheet" href="../../../../components/fpv/sh-request-card/web/sh-request-card.css">
  <link rel="stylesheet" href="sh-fpv-requests.css">
  <style>
    body { margin: 0; padding: var(--sh-space-24) var(--sh-space-page-margin); background: var(--sh-background-soft); color: var(--sh-text-primary); font-family: var(--sh-typo-font-family-primary); }
    h2.demo { margin: var(--sh-space-32) 0 var(--sh-space-12); }
    p.note { margin: 0 0 var(--sh-space-12); color: var(--sh-text-secondary); max-width: 80ch; }
    .grid { display: flex; gap: var(--sh-space-24); flex-wrap: wrap; align-items: flex-start; }
    figure { margin: 0; width: 360px; }   /* Figma: section 360 wide */
    figcaption { margin-bottom: var(--sh-space-8); color: var(--sh-text-secondary); }
    .surface { padding: 0; background: var(--sh-background-default); }
    /* demo only: marks the empty premium badge slot (art not in the repo) */
    .art-missing { width: var(--sh-space-32); height: var(--sh-space-40); outline: var(--sh-stroke-default) dashed var(--sh-border-strong); border-radius: var(--sh-radius-xs); }
  </style>
</head>
<body>
  <h1 class="sh-heading-md">sh-fpv-requests</h1>
  <h2 class="demo sh-title-md">Count</h2>
  <div class="grid">
    <figure><figcaption class="sh-body-sm">Count=3</figcaption><div class="surface">
      <section class="sh-fpv-requests" aria-labelledby="req-38"><div class="sh-fpv-requests__header"><div class="sh-fpv-section-title"><div class="sh-fpv-section-title__top"><div class="sh-fpv-section-title__title-group"><div class="sh-fpv-section-title__title-row"><h2 class="sh-fpv-section-title__title sh-heading-sm" id="req-38">Requests from Meher</h2></div></div></div></div></div><ul class="sh-fpv-requests__cards" role="list"><li><article class="sh-request-card"><div class="sh-request-card__content"><p class="sh-request-card__meta"><span class="sh-request-card__meta-icon sh-icon sh-icon--12" style="--icon:url(../../../../icons/line/message.svg)" aria-hidden="true"></span><span class="sh-request-card__meta-text sh-body-sm-tight">She sent you a message</span></p><p class="sh-request-card__message sh-body-md">“Hi, we liked your profile and would like to take this forward. Do let us know a good time to talk.”</p></div><button class="sh-request-card__cta sh-button sh-button--secondary sh-button--sm" type="button"><span class="sh-button__text"><span class="sh-button__label sh-button-sm">Reply</span></span></button></article></li><li><article class="sh-request-card sh-request-card--photo"><div class="sh-request-card__content"><p class="sh-request-card__meta"><span class="sh-request-card__meta-icon sh-icon sh-icon--12" style="--icon:url(../../../../icons/line/image.svg)" aria-hidden="true"></span><span class="sh-request-card__meta-text sh-body-sm-tight">She asked for your photo</span></p><p class="sh-request-card__message sh-body-md">Add a photo so Meher can see you</p></div><button class="sh-request-card__cta sh-button sh-button--secondary sh-button--sm" type="button"><span class="sh-button__text"><span class="sh-button__label sh-button-sm">Add photo</span></span></button></article></li><li><article class="sh-request-card sh-request-card--birth-details"><div class="sh-request-card__content"><p class="sh-request-card__meta"><span class="sh-request-card__meta-icon sh-icon sh-icon--12" style="--icon:url(../../../../icons/line/astro.svg)" aria-hidden="true"></span><span class="sh-request-card__meta-text sh-body-sm-tight">She asked for birth details</span></p><p class="sh-request-card__message sh-body-md">Add yours to see your Kundali match</p></div><button class="sh-request-card__cta sh-button sh-button--secondary sh-button--sm" type="button"><span class="sh-button__text"><span class="sh-button__label sh-button-sm">Add details</span></span></button></article></li></ul></section>
    </div></figure>
    <figure><figcaption class="sh-body-sm">Count=2</figcaption><div class="surface">
      <section class="sh-fpv-requests" aria-labelledby="req-39"><div class="sh-fpv-requests__header"><div class="sh-fpv-section-title"><div class="sh-fpv-section-title__top"><div class="sh-fpv-section-title__title-group"><div class="sh-fpv-section-title__title-row"><h2 class="sh-fpv-section-title__title sh-heading-sm" id="req-39">Requests from Meher</h2></div></div></div></div></div><ul class="sh-fpv-requests__cards" role="list"><li><article class="sh-request-card"><div class="sh-request-card__content"><p class="sh-request-card__meta"><span class="sh-request-card__meta-icon sh-icon sh-icon--12" style="--icon:url(../../../../icons/line/message.svg)" aria-hidden="true"></span><span class="sh-request-card__meta-text sh-body-sm-tight">She sent you a message</span></p><p class="sh-request-card__message sh-body-md">“Hi, we liked your profile and would like to take this forward. Do let us know a good time to talk.”</p></div><button class="sh-request-card__cta sh-button sh-button--secondary sh-button--sm" type="button"><span class="sh-button__text"><span class="sh-button__label sh-button-sm">Reply</span></span></button></article></li><li><article class="sh-request-card sh-request-card--photo"><div class="sh-request-card__content"><p class="sh-request-card__meta"><span class="sh-request-card__meta-icon sh-icon sh-icon--12" style="--icon:url(../../../../icons/line/image.svg)" aria-hidden="true"></span><span class="sh-request-card__meta-text sh-body-sm-tight">She asked for your photo</span></p><p class="sh-request-card__message sh-body-md">Add a photo so Meher can see you</p></div><button class="sh-request-card__cta sh-button sh-button--secondary sh-button--sm" type="button"><span class="sh-button__text"><span class="sh-button__label sh-button-sm">Add photo</span></span></button></article></li></ul></section>
    </div></figure>
    <figure><figcaption class="sh-body-sm">Count=1</figcaption><div class="surface">
      <section class="sh-fpv-requests" aria-labelledby="req-40"><div class="sh-fpv-requests__header"><div class="sh-fpv-section-title"><div class="sh-fpv-section-title__top"><div class="sh-fpv-section-title__title-group"><div class="sh-fpv-section-title__title-row"><h2 class="sh-fpv-section-title__title sh-heading-sm" id="req-40">Requests from Meher</h2></div></div></div></div></div><ul class="sh-fpv-requests__cards" role="list"><li><article class="sh-request-card"><div class="sh-request-card__content"><p class="sh-request-card__meta"><span class="sh-request-card__meta-icon sh-icon sh-icon--12" style="--icon:url(../../../../icons/line/message.svg)" aria-hidden="true"></span><span class="sh-request-card__meta-text sh-body-sm-tight">She sent you a message</span></p><p class="sh-request-card__message sh-body-md">“Hi, we liked your profile and would like to take this forward. Do let us know a good time to talk.”</p></div><button class="sh-request-card__cta sh-button sh-button--secondary sh-button--sm" type="button"><span class="sh-button__text"><span class="sh-button__label sh-button-sm">Reply</span></span></button></article></li></ul></section>
    </div></figure>
  </div>
</body>
</html>
