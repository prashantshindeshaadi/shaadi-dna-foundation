<!doctype html>
<!--
  sh-alert — web (HTML5 + CSS). Every variant: Style Inline / Banner × Type Information / Success / Warning / Error,
  plus Show title / Show action / Show close off.
  Spec: ../sh-alert.md · Figma node 2718:41675
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sh-alert</title>
  <link rel="stylesheet" href="../../../dist/css/tokens.css">
  <link rel="stylesheet" href="../../../dist/sh-typo-kit/developer/web/sh-typo.css">
  <link rel="stylesheet" href="../../sh-icon/web/sh-icon.css">
  <link rel="stylesheet" href="../../sh-text-link/web/sh-text-link.css">
  <link rel="stylesheet" href="sh-alert.css">
  <style>
    body { margin: 0; padding: var(--sh-space-24) var(--sh-space-page-margin); background: var(--sh-background-default); color: var(--sh-text-primary); font-family: var(--sh-typo-font-family-primary); }
    h2 { margin: var(--sh-space-32) 0 var(--sh-space-12); }
    .grid { display: flex; gap: var(--sh-space-24); flex-wrap: wrap; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { margin-bottom: var(--sh-space-12); color: var(--sh-text-secondary); }
    .inline { width: 328px; }   /* Figma frame width 328 */
    .banner { width: 360px; }   /* Figma frame width 360 (edge to edge) */
  </style>
</head>
<body>
  <h1 class="sh-heading-md">sh-alert</h1>

  <h2 class="sh-title-md">Style=Inline</h2>
  <div class="grid">
    <figure class="inline"><figcaption class="sh-body-sm">Style=Inline, Type=Information</figcaption>
      <div class="sh-alert sh-alert--information" role="status">
        <span class="sh-alert__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/information-circle.svg)" aria-hidden="true"></span>
        <div class="sh-alert__content">
          <p class="sh-alert__title sh-title-sm">Complete your profile</p>
          <p class="sh-alert__body sh-body-sm">Profiles with 5 photos get 3x more responses.</p>
          <a class="sh-alert__action sh-text-link sh-text-link--link sh-text-link--sm" href="#"><span class="sh-text-link__label sh-button-sm">Add photos</span></a>
        </div>
        <button class="sh-alert__close" type="button" aria-label="Close"><span class="sh-icon sh-icon--16" style="--icon:url(../../../icons/line/close.svg)" aria-hidden="true"></span></button>
      </div>
    </figure>
    <figure class="inline"><figcaption class="sh-body-sm">Style=Inline, Type=Success</figcaption>
      <div class="sh-alert sh-alert--success" role="status">
        <span class="sh-alert__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/check-circle.svg)" aria-hidden="true"></span>
        <div class="sh-alert__content">
          <p class="sh-alert__title sh-title-sm">Photos approved</p>
          <p class="sh-alert__body sh-body-sm">Your 5 photos are now live on your profile.</p>
          <a class="sh-alert__action sh-text-link sh-text-link--link sh-text-link--sm" href="#"><span class="sh-text-link__label sh-button-sm">View profile</span></a>
        </div>
        <button class="sh-alert__close" type="button" aria-label="Close"><span class="sh-icon sh-icon--16" style="--icon:url(../../../icons/line/close.svg)" aria-hidden="true"></span></button>
      </div>
    </figure>
    <figure class="inline"><figcaption class="sh-body-sm">Style=Inline, Type=Warning</figcaption>
      <div class="sh-alert sh-alert--warning" role="alert">
        <span class="sh-alert__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/alert-diamond.svg)" aria-hidden="true"></span>
        <div class="sh-alert__content">
          <p class="sh-alert__title sh-title-sm">Plan expires in 3 days</p>
          <p class="sh-alert__body sh-body-sm">Renew now to keep contacting your matches.</p>
          <a class="sh-alert__action sh-text-link sh-text-link--link sh-text-link--sm" href="#"><span class="sh-text-link__label sh-button-sm">Renew plan</span></a>
        </div>
        <button class="sh-alert__close" type="button" aria-label="Close"><span class="sh-icon sh-icon--16" style="--icon:url(../../../icons/line/close.svg)" aria-hidden="true"></span></button>
      </div>
    </figure>
    <figure class="inline"><figcaption class="sh-body-sm">Style=Inline, Type=Error</figcaption>
      <div class="sh-alert sh-alert--error" role="alert">
        <span class="sh-alert__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/alert-circle.svg)" aria-hidden="true"></span>
        <div class="sh-alert__content">
          <p class="sh-alert__title sh-title-sm">Photo upload failed</p>
          <p class="sh-alert__body sh-body-sm">Check your connection and upload again.</p>
          <a class="sh-alert__action sh-text-link sh-text-link--link sh-text-link--sm" href="#"><span class="sh-text-link__label sh-button-sm">Try again</span></a>
        </div>
        <button class="sh-alert__close" type="button" aria-label="Close"><span class="sh-icon sh-icon--16" style="--icon:url(../../../icons/line/close.svg)" aria-hidden="true"></span></button>
      </div>
    </figure>
  </div>

  <h2 class="sh-title-md">Style=Banner</h2>
  <div class="grid">
    <figure class="banner"><figcaption class="sh-body-sm">Style=Banner, Type=Information</figcaption>
      <div class="sh-alert sh-alert--banner sh-alert--information" role="status">
        <span class="sh-alert__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/information-circle.svg)" aria-hidden="true"></span>
        <div class="sh-alert__content">
          <p class="sh-alert__title sh-title-sm">You are offline</p>
          <p class="sh-alert__body sh-body-sm">We'll send your messages when you're back online.</p>
          <a class="sh-alert__action sh-text-link sh-text-link--link sh-text-link--sm" href="#"><span class="sh-text-link__label sh-button-sm">Retry</span></a>
        </div>
        <button class="sh-alert__close" type="button" aria-label="Close"><span class="sh-icon sh-icon--16" style="--icon:url(../../../icons/line/close.svg)" aria-hidden="true"></span></button>
      </div>
    </figure>
    <figure class="banner"><figcaption class="sh-body-sm">Style=Banner, Type=Success</figcaption>
      <div class="sh-alert sh-alert--banner sh-alert--success" role="status">
        <span class="sh-alert__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/check-circle.svg)" aria-hidden="true"></span>
        <div class="sh-alert__content">
          <p class="sh-alert__title sh-title-sm">Payment successful</p>
          <p class="sh-alert__body sh-body-sm">Your Gold plan is active till 30 Jan 2027.</p>
          <a class="sh-alert__action sh-text-link sh-text-link--link sh-text-link--sm" href="#"><span class="sh-text-link__label sh-button-sm">View plan</span></a>
        </div>
        <button class="sh-alert__close" type="button" aria-label="Close"><span class="sh-icon sh-icon--16" style="--icon:url(../../../icons/line/close.svg)" aria-hidden="true"></span></button>
      </div>
    </figure>
    <figure class="banner"><figcaption class="sh-body-sm">Style=Banner, Type=Warning</figcaption>
      <div class="sh-alert sh-alert--banner sh-alert--warning" role="alert">
        <span class="sh-alert__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/alert-diamond.svg)" aria-hidden="true"></span>
        <div class="sh-alert__content">
          <p class="sh-alert__title sh-title-sm">Plan expires today</p>
          <p class="sh-alert__body sh-body-sm">Renew to keep your Premium benefits.</p>
          <a class="sh-alert__action sh-text-link sh-text-link--link sh-text-link--sm" href="#"><span class="sh-text-link__label sh-button-sm">Renew plan</span></a>
        </div>
        <button class="sh-alert__close" type="button" aria-label="Close"><span class="sh-icon sh-icon--16" style="--icon:url(../../../icons/line/close.svg)" aria-hidden="true"></span></button>
      </div>
    </figure>
    <figure class="banner"><figcaption class="sh-body-sm">Style=Banner, Type=Error</figcaption>
      <div class="sh-alert sh-alert--banner sh-alert--error" role="alert">
        <span class="sh-alert__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/alert-circle.svg)" aria-hidden="true"></span>
        <div class="sh-alert__content">
          <p class="sh-alert__title sh-title-sm">Payment failed</p>
          <p class="sh-alert__body sh-body-sm">Your bank declined the payment. No money was taken.</p>
          <a class="sh-alert__action sh-text-link sh-text-link--link sh-text-link--sm" href="#"><span class="sh-text-link__label sh-button-sm">Try again</span></a>
        </div>
        <button class="sh-alert__close" type="button" aria-label="Close"><span class="sh-icon sh-icon--16" style="--icon:url(../../../icons/line/close.svg)" aria-hidden="true"></span></button>
      </div>
    </figure>
  </div>

  <h2 class="sh-title-md">Show title / Show action / Show close off</h2>
  <div class="grid">
    <figure class="inline"><figcaption class="sh-body-sm">Show title=false</figcaption>
      <div class="sh-alert sh-alert--information" role="status">
        <span class="sh-alert__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/information-circle.svg)" aria-hidden="true"></span>
        <div class="sh-alert__content">
          <p class="sh-alert__body sh-body-sm">Profiles with 5 photos get 3x more responses.</p>
          <a class="sh-alert__action sh-text-link sh-text-link--link sh-text-link--sm" href="#"><span class="sh-text-link__label sh-button-sm">Add photos</span></a>
        </div>
        <button class="sh-alert__close" type="button" aria-label="Close"><span class="sh-icon sh-icon--16" style="--icon:url(../../../icons/line/close.svg)" aria-hidden="true"></span></button>
      </div>
    </figure>
    <figure class="inline"><figcaption class="sh-body-sm">Show action=false, Show close=false</figcaption>
      <div class="sh-alert sh-alert--warning" role="alert">
        <span class="sh-alert__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/alert-diamond.svg)" aria-hidden="true"></span>
        <div class="sh-alert__content">
          <p class="sh-alert__title sh-title-sm">Verify your phone</p>
          <p class="sh-alert__body sh-body-sm">Verified profiles get replies faster.</p>
        </div>
      </div>
    </figure>
  </div>
</body>
</html>
