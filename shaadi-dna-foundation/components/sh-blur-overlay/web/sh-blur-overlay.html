<!doctype html>
<!--
  sh-blur-overlay — web (HTML5 + CSS). Both variants (Unlock Self / Upgrade), Light and Dark, plus Backdrop swaps.
  Spec: ../sh-blur-overlay.md · Figma node 3363:74823
  Run `python3 tools/build.py` once so dist/ exists. Shown under a neutral placeholder section (the FPV sections
  it locks have no web code yet). The section Art drawings are not in the repo, so real backdrops show without art.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sh-blur-overlay</title>
  <link rel="stylesheet" href="../../../dist/css/tokens.css">
  <link rel="stylesheet" href="../../../dist/sh-typo-kit/developer/web/sh-typo.css">
  <link rel="stylesheet" href="../../../components/sh-icon/web/sh-icon.css">
  <link rel="stylesheet" href="../../../components/sh-button/web/sh-button.css">
  <link rel="stylesheet" href="../../../components/sh-graphic/web/sh-graphic.css">
  <link rel="stylesheet" href="sh-blur-overlay.css">
  <style>
    body { margin: 0; padding: var(--sh-space-24) var(--sh-space-page-margin); background: var(--sh-background-soft); color: var(--sh-text-primary); font-family: var(--sh-typo-font-family-primary); }
    h2 { margin: var(--sh-space-32) 0 var(--sh-space-12); }
    .grid { display: flex; flex-wrap: wrap; gap: var(--sh-space-24); align-items: flex-start; }
    .screen { margin: 0; width: 360px; }                               /* Figma frame width 360 */
    .screen figcaption { margin-bottom: var(--sh-space-8); color: var(--sh-text-secondary); }
    .page { background: var(--sh-background-default); color: var(--sh-text-primary); border-radius: var(--sh-radius-md); overflow: hidden; }
    .placeholder-section { padding: var(--sh-space-16) var(--sh-space-20) var(--sh-space-8); color: var(--sh-text-secondary); }
  </style>
</head>
<body>
  <h1 class="sh-heading-md">sh-blur-overlay</h1>

  <div class="grid">

        <div class="placeholder-section sh-title-md">Section</div>
        <section class="sh-blur-overlay" aria-label="Section locked">

    </figure>
    <figure class="screen"><figcaption class="sh-support-meta">Unlock=Self, Graphic=Placeholder, Mode=Dark</figcaption>
