    p.note { margin: 0 0 var(--sh-space-16); color: var(--sh-text-secondary); max-width: 80ch; }
    .grid { display: grid; grid-template-columns: repeat(4, 240px); gap: var(--sh-space-16); }
    .grid__head { color: var(--sh-text-secondary); }
    .cell { margin: 0; padding: var(--sh-space-8); background: var(--sh-background-default); color: var(--sh-text-primary); border-radius: var(--sh-radius-md); }
    .cell figcaption { margin-bottom: var(--sh-space-8); color: var(--sh-text-secondary); }
    .missing { outline: 1px dashed var(--sh-border-strong); outline-offset: -1px; }
    .missing__note { display: block; margin-top: var(--sh-space-4); color: var(--sh-text-tertiary); }
