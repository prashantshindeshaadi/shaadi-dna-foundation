<!doctype html>
<!--
  sh-list-info — web (HTML5 + CSS). Every variant: Lines Single / Double × Content Text / Masked Phone /
  Masked Email / Masked / Masked Value (the 6 Figma variants), and a stacked FPV detail list.
  Spec: ../sh-list-info.md · Figma node 2877:15742
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sh-list-info</title>
  <link rel="stylesheet" href="../../../dist/css/tokens.css">
  <link rel="stylesheet" href="../../../dist/sh-typo-kit/developer/web/sh-typo.css">
  <link rel="stylesheet" href="../../../components/sh-icon/web/sh-icon.css">
  <link rel="stylesheet" href="../../../components/fpv/sh-fpv-locked-text/web/sh-fpv-locked-text.css">
  <link rel="stylesheet" href="sh-list-info.css">
  <style>
    body { margin: 0; padding: var(--sh-space-24) var(--sh-space-page-margin); background: var(--sh-background-soft); color: var(--sh-text-primary); font-family: var(--sh-typo-font-family-primary); }
    h2 { margin: var(--sh-space-32) 0 var(--sh-space-12); }
    p.note { margin: var(--sh-space-12) 0; color: var(--sh-text-secondary); max-width: 80ch; }
    .grid { display: flex; gap: var(--sh-space-24); flex-wrap: wrap; align-items: flex-start; }
    figure { margin: 0; width: 328px; }
    figcaption { margin-bottom: var(--sh-space-8); color: var(--sh-text-secondary); }
    .surface { background: var(--sh-background-default); padding: 0 var(--sh-space-padding-card); }
    .card { background: var(--sh-background-default); padding: var(--sh-space-padding-card); border-radius: var(--sh-radius-card); display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <h1 class="sh-heading-md">sh-list-info</h1>

  <h2 class="sh-title-md">Content=Text</h2>
  <div class="grid">
    <figure><figcaption class="sh-body-sm">Lines=Single, Content=Text</figcaption><div class="surface"><div class="sh-list-info"><span class="sh-list-info__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/diet.svg)" aria-hidden="true"></span><span class="sh-list-info__content"><span class="sh-list-info__text sh-body-lg-tight">Non-Vegetarian</span></span></div></div></figure>
    <figure><figcaption class="sh-body-sm">Lines=Double, Content=Text</figcaption><div class="surface"><div class="sh-list-info sh-list-info--double"><span class="sh-list-info__icon-box"><span class="sh-list-info__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/income.svg)" aria-hidden="true"></span></span><span class="sh-list-info__content"><span class="sh-list-info__text sh-body-lg-tight">Earns ₹15 – 20 Lakh</span><span class="sh-list-info__support sh-body-md-tight">Annual income</span></span></div></div></figure>
  </div>

    <figure><figcaption class="sh-body-sm">Lines=Single, Content=Masked Value</figcaption><div class="surface"><div class="sh-list-info sh-list-info--masked-value"><span class="sh-list-info__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/calendar-range.svg)" aria-hidden="true"></span><span class="sh-list-info__content"><span class="sh-list-info__text sh-body-lg-tight">Born on</span><span class="sh-fpv-locked-text sh-fpv-locked-text--date-of-birth" role="img" aria-label="Date of birth hidden. Upgrade to view"><span class="sh-fpv-locked-text__mask" style="--icon:url(../../../icons/filled/asterisk.svg)" aria-hidden="true"><span class="sh-fpv-locked-text__dot sh-icon"></span><span class="sh-fpv-locked-text__dot sh-icon"></span><span class="sh-fpv-locked-text__separator"></span><span class="sh-fpv-locked-text__dot sh-icon"></span><span class="sh-fpv-locked-text__dot sh-icon"></span><span class="sh-fpv-locked-text__separator"></span><span class="sh-fpv-locked-text__dot sh-icon"></span><span class="sh-fpv-locked-text__dot sh-icon"></span></span><span class="sh-fpv-locked-text__lock sh-icon sh-icon--12" style="--icon:url(../../../icons/filled/lock.svg)" aria-hidden="true"></span></span></span></div></div></figure>
  </div>

  </div>
