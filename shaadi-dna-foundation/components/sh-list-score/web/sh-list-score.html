<!doctype html>
<!--
  sh-list-score — web (HTML5 + CSS). Every variant: State Default / No match / Locked, plus the booleans
  (subtitle, value caption, divider).
  Spec: ../sh-list-score.md · Figma node 3322:75527
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sh-list-score</title>
  <link rel="stylesheet" href="../../../dist/css/tokens.css">
  <link rel="stylesheet" href="../../../dist/sh-typo-kit/developer/web/sh-typo.css">
  <link rel="stylesheet" href="../../../components/sh-icon/web/sh-icon.css">
  <link rel="stylesheet" href="../../../components/sh-divider/web/sh-divider.css">
  <link rel="stylesheet" href="../../../components/sh-list-default/web/sh-list-default.css">
  <link rel="stylesheet" href="../../../components/sh-list-score/web/sh-list-score.css">
  <style>
    body { margin: 0; padding: var(--sh-space-24) var(--sh-space-page-margin); background: var(--sh-background-soft); color: var(--sh-text-primary); font-family: var(--sh-typo-font-family-primary); }
    h2 { margin: var(--sh-space-32) 0 var(--sh-space-12); }
    p.note { margin: 0 0 var(--sh-space-12); color: var(--sh-text-secondary); max-width: 80ch; }
    .grid { display: flex; gap: var(--sh-space-24); flex-wrap: wrap; align-items: flex-start; }
    figure { margin: 0; width: 360px; }   /* Figma: rows are 360 wide */
    figcaption { margin-bottom: var(--sh-space-8); color: var(--sh-text-secondary); }
    .surface { background: var(--sh-background-default); }
    .card { background: var(--sh-background-default); padding: 0 var(--sh-space-padding-card); border-radius: var(--sh-radius-card); }

  </style>
</head>
<body>
  <h1 class="sh-heading-md">sh-list-score</h1>

  <h2 class="sh-title-md">State</h2>
  <div class="grid">
    <figure><figcaption class="sh-body-sm">State=Default</figcaption><div class="surface"><div class="sh-list-score"><div class="sh-list-default__row"><span class="sh-list-default__leading"><img class="sh-list-default__pictogram sh-icon" src="../../../icons/pictogram/koota-rajju@2x.png" alt=""></span><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-lg">Rajju</span></span></span><span class="sh-list-default__trailing"><span class="sh-list-default__value sh-body-lg">1/1</span></span></div></div></div></figure>
    <figure><figcaption class="sh-body-sm">State=No match</figcaption><div class="surface"><div class="sh-list-score sh-list-score--no-match"><div class="sh-list-default__row"><span class="sh-list-default__leading"><img class="sh-list-default__pictogram sh-icon" src="../../../icons/pictogram/koota-bhakoot@2x.png" alt=""></span><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-lg">Bhakoot</span></span></span><span class="sh-list-default__trailing"><span class="sh-list-default__value sh-body-lg">0/7</span></span></div></div></div></figure>
    <figure><figcaption class="sh-body-sm">State=Locked</figcaption><div class="surface"><div class="sh-list-score sh-list-score--locked"><div class="sh-list-default__row"><span class="sh-list-default__leading"><img class="sh-list-default__pictogram sh-icon" src="../../../icons/pictogram/koota-nadi.svg" alt=""></span><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-lg">Nadi</span></span></span><span class="sh-list-default__trailing"><span class="sh-list-score__lock sh-icon sh-icon--12" style="--icon:url(../../../icons/filled/lock.svg)" role="img" aria-label="Locked"></span></span></div></div></div></figure>
  </div>

  <h2 class="sh-title-md">Show subtitle · Show value caption · Show divider (a koota list)</h2>
  <div class="grid">
    <figure><figcaption class="sh-body-sm">Show subtitle=true, Show value caption=true</figcaption><div class="surface"><div class="sh-list-score"><div class="sh-list-default__row"><span class="sh-list-default__leading"><img class="sh-list-default__pictogram sh-icon" src="../../../icons/pictogram/koota-gana@2x.png" alt=""></span><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-lg">Gana</span></span><span class="sh-list-default__subtitle sh-body-sm">Temperament</span></span><span class="sh-list-default__trailing"><span class="sh-list-default__value-caption sh-body-sm">points</span><span class="sh-list-default__value sh-body-lg">6/6</span></span></div></div></div></figure>
    <figure><figcaption class="sh-body-sm">Show divider=true</figcaption><div class="surface"><div class="sh-list-score"><div class="sh-list-default__row"><span class="sh-list-default__leading"><img class="sh-list-default__pictogram sh-icon" src="../../../icons/pictogram/koota-varna@2x.png" alt=""></span><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-lg">Varna</span></span></span><span class="sh-list-default__trailing"><span class="sh-list-default__value sh-body-lg">1/1</span></span></div><hr class="sh-list-default__divider sh-divider sh-divider--soft"></div><div class="sh-list-score"><div class="sh-list-default__row"><span class="sh-list-default__leading"><img class="sh-list-default__pictogram sh-icon" src="../../../icons/pictogram/koota-vashya@2x.png" alt=""></span><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-lg">Vashya</span></span></span><span class="sh-list-default__trailing"><span class="sh-list-default__value sh-body-lg">2/2</span></span></div><hr class="sh-list-default__divider sh-divider sh-divider--soft"></div><div class="sh-list-score sh-list-score--no-match"><div class="sh-list-default__row"><span class="sh-list-default__leading"><img class="sh-list-default__pictogram sh-icon" src="../../../icons/pictogram/koota-yoni@2x.png" alt=""></span><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-lg">Yoni</span></span></span><span class="sh-list-default__trailing"><span class="sh-list-default__value sh-body-lg">0/4</span></span></div><hr class="sh-list-default__divider sh-divider sh-divider--soft"></div><div class="sh-list-score sh-list-score--locked"><div class="sh-list-default__row"><span class="sh-list-default__leading"><img class="sh-list-default__pictogram sh-icon" src="../../../icons/pictogram/koota-graha-maitri@2x.png" alt=""></span><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-lg">Graha Maitri</span></span></span><span class="sh-list-default__trailing"><span class="sh-list-score__lock sh-icon sh-icon--12" style="--icon:url(../../../icons/filled/lock.svg)" role="img" aria-label="Locked"></span></span></div></div></div></figure>
  </div>
  <p class="note sh-body-sm">The lock colour is not bound in Figma; icon/disabled is used, matching the greyed name.</p>
</body>
</html>
