<!doctype html>
<!--
  sh-list — web (HTML5 + CSS). Every variant: Type Default / Preference / Report / Score / Highlight / Grouped / Info —
  one wrapper around one row part (each part's own page shows all its options).
  Spec: ../sh-list.md · Figma node 3322:75631
-->
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { margin: 0; padding: var(--sh-space-24) var(--sh-space-page-margin); background: var(--sh-background-soft); color: var(--sh-text-primary); font-family: var(--sh-typo-font-family-primary); }
    h2 { margin: var(--sh-space-32) 0 var(--sh-space-12); }
    p.note { margin: 0 0 var(--sh-space-12); color: var(--sh-text-secondary); max-width: 80ch; }
    .grid { display: flex; gap: var(--sh-space-24); flex-wrap: wrap; align-items: flex-start; }
    figure { margin: 0; width: 360px; }   /* Figma: rows are 360 wide */
    figcaption { margin-bottom: var(--sh-space-8); color: var(--sh-text-secondary); }
    .surface { background: var(--sh-background-default); }
    .card { background: var(--sh-background-default); padding: 0 var(--sh-space-padding-card); border-radius: var(--sh-radius-card); }

  </style>
</head>
<body>
  <h1 class="sh-heading-md">sh-list</h1>

  <h2 class="sh-title-md">Type</h2>
  <div class="grid">
    <figure><figcaption class="sh-body-sm">Type=Default</figcaption><div class="surface"><div class="sh-list"><div class="sh-list-default sh-list-default--icon sh-list-default--chevron"><a class="sh-list-default__row" href="#"><span class="sh-list-default__leading"><span class="sh-list-default__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/settings.svg)" aria-hidden="true"></span></span><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-md">Account settings</span></span></span><span class="sh-list-default__trailing"><span class="sh-list-default__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/arrow-right-01.svg)" aria-hidden="true"></span></span></a><hr class="sh-list-default__divider sh-divider sh-divider--soft"></div></div><div class="sh-list"><div class="sh-list-default sh-list-default--icon sh-list-default--chevron"><a class="sh-list-default__row" href="#"><span class="sh-list-default__leading"><span class="sh-list-default__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/credit-card.svg)" aria-hidden="true"></span></span><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-md">Payment options</span></span></span><span class="sh-list-default__trailing"><span class="sh-list-default__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/arrow-right-01.svg)" aria-hidden="true"></span></span></a></div></div></div></figure>

    <figure><figcaption class="sh-body-sm">Type=Report</figcaption><div class="card"><div class="sh-list sh-list--report"><div class="sh-list-report"><a class="sh-list-default__row" href="#"><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-lg">Kundali match report</span></span><span class="sh-list-default__subtitle sh-body-md">28 of 36 gunas match</span></span><span class="sh-list-default__trailing"><span class="sh-list-default__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/arrow-right-01.svg)" aria-hidden="true"></span></span></a><hr class="sh-list-default__divider sh-divider sh-divider--soft"></div></div><div class="sh-list sh-list--report"><div class="sh-list-report sh-list-report--premium-lock"><div class="sh-list-default__row"><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-lg">Manglik dosha report</span></span><span class="sh-list-default__subtitle sh-body-md">Know if she is Manglik</span></span><span class="sh-list-default__trailing"><span class="sh-list-report__lock sh-icon sh-icon--16" style="--icon:url(../../../icons/filled/lock.svg)" role="img" aria-label="Locked"></span></span></div></div></div></div></figure>

    <figure><figcaption class="sh-body-sm">Type=Highlight</figcaption><div class="surface"><div class="sh-list sh-list--highlight"><div class="sh-list-highlight"><div class="sh-list-default__row"><span class="sh-list-default__leading"><span class="sh-list-default__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/contact.svg)" aria-hidden="true"></span></span><span class="sh-list-default__content"><span class="sh-list-default__title-row"><span class="sh-list-default__title sh-body-sm">She viewed your contact details</span></span></span><span class="sh-list-default__trailing"><a class="sh-text-link sh-text-link--link sh-text-link--sm sh-text-link--no-border" href="#"><span class="sh-text-link__label sh-button-sm">View</span></a></span></div></div></div></div></figure>

    <figure><figcaption class="sh-body-sm">Type=Info</figcaption><div class="card"><div class="sh-list sh-list--info"><div class="sh-list-info"><span class="sh-list-info__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/diet.svg)" aria-hidden="true"></span><span class="sh-list-info__content"><span class="sh-list-info__text sh-body-lg-tight">Non-Vegetarian</span></span></div></div><div class="sh-list sh-list--info"><div class="sh-list-info sh-list-info--masked-email"><span class="sh-list-info__icon sh-icon sh-icon--20" style="--icon:url(../../../icons/line/email.svg)" aria-hidden="true"></span><span class="sh-list-info__content"><span class="sh-fpv-locked-text" role="img" aria-label="Email hidden, at gmail.com. Upgrade to view"><span class="sh-fpv-locked-text__mask" style="--icon:url(../../../icons/filled/asterisk.svg)" aria-hidden="true"><span class="sh-fpv-locked-text__dot sh-icon"></span><span class="sh-fpv-locked-text__dot sh-icon"></span><span class="sh-fpv-locked-text__dot sh-icon"></span><span class="sh-fpv-locked-text__dot sh-icon"></span><span class="sh-fpv-locked-text__dot sh-icon"></span><span class="sh-fpv-locked-text__dot sh-icon"></span></span><span class="sh-list-info__text sh-body-lg-tight">@gmail.com</span><span class="sh-fpv-locked-text__lock sh-icon sh-icon--12" style="--icon:url(../../../icons/filled/lock.svg)" aria-hidden="true"></span></span></span></div></div></div></figure>
  </div>
