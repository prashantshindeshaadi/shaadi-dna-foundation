<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sh-photo-upload</title>
  <link rel="stylesheet" href="../../../dist/css/tokens.css">
  <link rel="stylesheet" href="../../../dist/sh-typo-kit/developer/web/sh-typo.css">

  <style>

<body>
  <h1 class="sh-heading-md">sh-photo-upload</h1>

  <h2 class="sh-title-md">State</h2>
  <div class="grid">
    <figure><figcaption class="sh-body-sm">State=Empty</figcaption>
      <label class="sh-photo-upload"><input class="sh-photo-upload__input" type="file" accept="image/*" aria-label="Add photo"><span class="sh-photo-upload__icon sh-icon sh-icon--24" style="--icon:url(../../../icons/line/plus-circle.svg)" aria-hidden="true"></span><span class="sh-photo-upload__label sh-support-label">Add photo</span></label>

    </figure>
    <figure><figcaption class="sh-body-sm">State=Done</figcaption>

    </figure>
  </div>

  <div class="grid">
    <figure><figcaption class="sh-body-sm">State=Empty · focus</figcaption>
      <label class="sh-photo-upload is-focus"><input class="sh-photo-upload__input" type="file" accept="image/*" aria-label="Add photo"><span class="sh-photo-upload__icon sh-icon sh-icon--24" style="--icon:url(../../../icons/line/plus-circle.svg)" aria-hidden="true"></span><span class="sh-photo-upload__label sh-support-label">Add photo</span></label>

    <figure><figcaption class="sh-body-sm">State=Error · focus</figcaption>

    </figure>
    <figure><figcaption class="sh-body-sm">State=Empty · disabled</figcaption>
      <label class="sh-photo-upload"><input class="sh-photo-upload__input" type="file" accept="image/*" aria-label="Add photo" disabled><span class="sh-photo-upload__icon sh-icon sh-icon--24" style="--icon:url(../../../icons/line/plus-circle.svg)" aria-hidden="true"></span><span class="sh-photo-upload__label sh-support-label">Add photo</span></label>
    </figure>
  </div>

    <div class="sh-photo-upload sh-photo-upload--done"><img class="sh-photo-upload__image" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2394A3B8'/%3E%3Cstop offset='.55' stop-color='%23475569'/%3E%3Cstop offset='1' stop-color='%231E293B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='400' height='500' fill='url(%23g)'/%3E%3C/svg%3E" alt="Your photo 2"><button class="sh-photo-upload__remove sh-icon-button sh-icon-button--translucent sh-icon-button--sm" type="button" aria-label="Remove photo 2"><span class="sh-icon-button__icon sh-icon" style="--icon:url(../../../icons/line/close.svg)" aria-hidden="true"></span></button></div>
    <div class="sh-photo-upload sh-photo-upload--uploading" role="status" aria-busy="true"><img class="sh-photo-upload__image" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2394A3B8'/%3E%3Cstop offset='.55' stop-color='%23475569'/%3E%3Cstop offset='1' stop-color='%231E293B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='400' height='500' fill='url(%23g)'/%3E%3C/svg%3E" alt=""><span class="sh-spinner sh-spinner--inverse" aria-hidden="true"><span class="sh-icon sh-spinner__icon" style="--icon:url(../../../icons/line/loader-circle.svg)"></span></span><span class="sh-photo-upload__label sh-support-label">Uploading</span></div>
    <button class="sh-photo-upload sh-photo-upload--error" type="button" aria-label="Upload failed. Retry"><span class="sh-photo-upload__icon sh-icon sh-icon--24" style="--icon:url(../../../icons/line/refresh.svg)" aria-hidden="true"></span><span class="sh-photo-upload__label sh-support-label">Retry</span></button>
    <label class="sh-photo-upload"><input class="sh-photo-upload__input" type="file" accept="image/*" aria-label="Add photo"><span class="sh-photo-upload__icon sh-icon sh-icon--24" style="--icon:url(../../../icons/line/plus-circle.svg)" aria-hidden="true"></span><span class="sh-photo-upload__label sh-support-label">Add photo</span></label>
    <label class="sh-photo-upload"><input class="sh-photo-upload__input" type="file" accept="image/*" aria-label="Add photo"><span class="sh-photo-upload__icon sh-icon sh-icon--24" style="--icon:url(../../../icons/line/plus-circle.svg)" aria-hidden="true"></span><span class="sh-photo-upload__label sh-support-label">Add photo</span></label>
  </div>

</html>
