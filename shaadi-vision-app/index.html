<!doctype html>
<!--
  Shaadi Vision App — web. A phone-sized Shaadi app (full screen on a phone, centred on a desktop) built only from
  DNA components: Home, Matches and Premium are real screens from the Shaadi DNA Figma file; Catalog is the
  foundation and the Core components; Components is everything else plus the Jira stories.
  Run `python3 shaadi-dna-foundation/tools/build.py` first, then serve the repo root:
  `python3 -m http.server 8765` → http://localhost:8765/shaadi-vision-app/
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shaadi</title>
  <!-- Every stylesheet and the script load with a version stamp, so a browser never mixes cached and new files. -->
  <script>
    window.VN_V = Date.now().toString(36);
    for (const href of ["../shaadi-dna-foundation/dist/css/tokens.css", "../shaadi-dna-foundation/dist/sh-typo-kit/developer/web/sh-typo.css",
                        "../shaadi-dna-foundation/dist/vision/components.css", "screens/screens.css", "vision.css"]) {
      document.write(`<link rel="stylesheet" href="${href}?v=${window.VN_V}">`);
    }
  </script>
</head>
<body>
  <div class="vn-app" id="app">
    <nav class="sh-navigation-bar vn-nav vn-glass" id="nav" aria-label="Main"></nav>
    <div class="vn-device">
      <div class="vn-device__status sh-status-bar" aria-hidden="true">
        <span class="sh-status-bar__time sh-body-md">12:30</span>
        <span class="sh-status-bar__icons">
          <span class="sh-icon sh-icon--16" data-icon="filled/signal.svg"></span>
          <span class="sh-icon sh-icon--16" data-icon="filled/battery.svg"></span>
        </span>
      </div>
      <main class="vn-screen" id="main" tabindex="-1"></main>
    </div>
    <button class="vn-mode sh-button sh-button--secondary sh-button--sm" type="button" data-mobile-view>
      <span class="sh-button__icon sh-icon" data-icon="line/phone.svg" aria-hidden="true"></span>
      <span class="sh-button__text"><span class="sh-button__label sh-button-sm">Mobile view</span></span>
    </button>
  </div>
  <!-- Mobile view: the same app at phone width in an iframe, so every breakpoint and token acts as on a phone -->
  <div class="vn-phone-view" id="phoneView" hidden>
    <button class="sh-button sh-button--secondary sh-button--sm" type="button" data-desktop-view>
      <span class="sh-button__icon sh-icon" data-icon="line/dashboard.svg" aria-hidden="true"></span>
      <span class="sh-button__text"><span class="sh-button__label sh-button-sm">Desktop view</span></span>
    </button>
    <div class="vn-phone"><iframe id="phoneFrame" title="Shaadi app, mobile view"></iframe></div>
  </div>
  <script>document.write(`<script src="vision.js?v=${window.VN_V}"><\/script>`);</script>
</body>
</html>
