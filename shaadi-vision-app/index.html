<!doctype html>
<!--
  Shaadi Vision App — web. A phone-sized Shaadi app (full screen on a phone, centred on a desktop) built only from
  DNA components: Home, Matches and Premium are real screens from the Shaadi DNA Figma file; Catalog is the
  foundation and the Core components; Components is everything else plus the Jira stories.
  Run `python3 shaadi-dna-foundation/tools/build.py` first, then serve the repo root:
  `python3 -m http.server 8765` → http://localhost:8765/shaadi-vision-app/
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shaadi</title>
  <link rel="stylesheet" href="../shaadi-dna-foundation/dist/css/tokens.css">
  <link rel="stylesheet" href="../shaadi-dna-foundation/dist/sh-typo-kit/developer/web/sh-typo.css">
  <link rel="stylesheet" href="../shaadi-dna-foundation/dist/vision/components.css">
  <link rel="stylesheet" href="screens/screens.css">
  <link rel="stylesheet" href="vision.css">
</head>
<body>
  <div class="vn-device" id="device">
    <div class="vn-device__status sh-status-bar" aria-hidden="true">
      <span class="sh-status-bar__time sh-body-md">12:30</span>
      <span class="sh-status-bar__icons">
        <span class="sh-icon sh-icon--16" data-icon="filled/signal.svg"></span>
        <span class="sh-icon sh-icon--16" data-icon="filled/battery.svg"></span>
      </span>
    </div>
    <main class="vn-screen" id="main" tabindex="-1"></main>
    <nav class="sh-navigation-bar vn-nav vn-glass" id="nav" aria-label="Main"></nav>
  </div>
  <script src="vision.js"></script>
</body>
</html>
