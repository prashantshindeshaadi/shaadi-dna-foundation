<!-- Matches: copies Figma frame 2712:26598 "Matches — Near Me". Status bar and navigation bar come from the app shell. -->
<div class="scr-screen">

  <header class="sh-app-header sh-app-header--title">
    <div class="sh-app-header__bar">
      <div class="sh-app-header__navigation"><button class="sh-icon-button sh-icon-button--tertiary sh-icon-button--md" type="button" aria-label="Open menu"><span class="sh-icon-button__icon sh-icon" style="--icon:url(ICON/line/menu.svg)" aria-hidden="true"></span></button></div>
      <h1 class="sh-app-header__title sh-heading-sm">Matches</h1>
      <div class="sh-app-header__actions"><button class="sh-icon-button sh-icon-button--tertiary sh-icon-button--md" type="button" aria-label="Search"><span class="sh-icon-button__icon sh-icon" style="--icon:url(ICON/line/search.svg)" aria-hidden="true"></span></button><button class="sh-icon-button sh-icon-button--tertiary sh-icon-button--md" type="button" aria-label="Notifications"><span class="sh-icon-button__icon sh-icon" style="--icon:url(ICON/line/notification.svg)" aria-hidden="true"></span></button></div>
    </div>
  </header>

  <div class="scr-scroll-row scr-pad-16" role="group" aria-label="Filters">
    <button class="sh-chip" type="button" aria-pressed="false"><span class="sh-chip__content"><span class="sh-chip__label sh-body-md">City</span></span><span class="sh-icon sh-icon--16 sh-chip__icon" style="--icon:url(ICON/line/arrow-down-01.svg)" aria-hidden="true"></span></button>
    <button class="sh-chip" type="button" aria-pressed="false"><span class="sh-chip__content"><span class="sh-chip__label sh-body-md">Mother Tongue</span></span><span class="sh-icon sh-icon--16 sh-chip__icon" style="--icon:url(ICON/line/arrow-down-01.svg)" aria-hidden="true"></span></button>
    <button class="sh-chip" type="button" aria-pressed="true"><span class="sh-icon sh-icon--16 sh-chip__icon" style="--icon:url(ICON/line/location-pin.svg)" aria-hidden="true"></span><span class="sh-chip__content"><span class="sh-chip__label sh-body-md">Nearby</span></span><span class="sh-icon sh-icon--16 sh-chip__icon" style="--icon:url(ICON/line/close.svg)" aria-hidden="true"></span></button>
  </div>

  <div class="sh-location-bar"><span class="sh-icon sh-icon--16 sh-location-bar__icon" style="--icon:url(ICON/filled/location-pin.svg)" aria-hidden="true"></span><p class="sh-location-bar__text"><span class="sh-location-bar__location sh-title-sm">Airoli, Navi Mumbai</span><span class="sh-location-bar__distance sh-body-sm">· 25 km</span></p><button class="sh-text-link sh-text-link--neutral sh-text-link--sm sh-text-link--no-border" type="button" aria-label="Change location"><span class="sh-text-link__label sh-button-sm">Change</span><span class="sh-text-link__icon sh-icon" style="--icon:url(ICON/line/edit.svg)" aria-hidden="true"></span></button></div>

  <div class="scr-stack scr-pad-x-16">
    <article class="sh-profile-card" data-type="connect" aria-label="Sneha Kaul, 26">
      <div class="sh-photo-wrapper sh-profile-card__photo">
        <div class="sh-photo-wrapper__image sh-user-image"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 340 542'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2394A3B8'/%3E%3Cstop offset='1' stop-color='%23334155'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='340' height='542' fill='url(%23g)'/%3E%3C/svg%3E" alt=""></div>
        <div class="sh-photo-wrapper__scrim sh-photo-wrapper__scrim--bottom"></div>
        <div class="sh-photo-wrapper__scrim sh-photo-wrapper__scrim--top"></div>
      </div>
      <div class="sh-profile-card__top">
        <div class="sh-profile-card__top-tags"><span class="sh-tag sh-tag--sm sh-tag-profile sh-tag-profile--promoted"><span class="sh-icon sh-icon--12 sh-tag__icon" style="--icon:url(ICON/filled/megaphone-02.svg)" aria-hidden="true"></span><span class="sh-tag__label sh-support-label">Promoted</span></span></div>
        <div class="sh-profile-card__top-actions"><button class="sh-icon-button sh-icon-button--translucent sh-icon-button--sm" type="button" aria-label="View photos"><span class="sh-icon-button__icon sh-icon" style="--icon:url(ICON/filled/image.svg)" aria-hidden="true"></span><span class="sh-icon-button__badge sh-body-sm">10</span></button><button class="sh-icon-button sh-icon-button--translucent sh-icon-button--sm" type="button" aria-label="More options"><span class="sh-icon-button__icon sh-icon" style="--icon:url(ICON/line/more-vertical.svg)" aria-hidden="true"></span></button></div>
      </div>
      <div class="sh-profile-card__info">
        <section class="sh-profile-card-info" aria-label="Sneha Kaul, 26">
          <div class="sh-profile-card-info__content">
            <div class="sh-profile-card-info__name-row">
              <div class="sh-profile-card-info__name-group">
                <h3 class="sh-profile-card-info__title"><span class="sh-profile-card-info__name sh-heading-sm">Sneha Kaul</span><span class="sh-profile-card-info__age sh-heading-sm">26</span></h3>
                <img class="sh-badge sh-badge--20" src="ASSET/icons/misc/premium-badge.svg" alt="Premium">
                <span class="sh-tag sh-tag--translucent-light sh-tag--sm sh-tag--pill sh-tag-profile sh-tag-profile--online"><img class="sh-icon sh-icon--12 sh-tag__icon" src="ASSET/icons/tag/online.svg" alt=""><span class="sh-tag__label sh-support-label">Online</span></span>
              </div>
              <span class="sh-profile-card-info__spacer"></span>
              <img class="sh-badge sh-badge--20" src="ASSET/icons/misc/verified-badge.svg" alt="Verified">
            </div>
            <div class="sh-profile-card-info__details">
              <p class="sh-info-detail-row"><span class="sh-info-detail sh-info-detail--on-image sh-info-detail--md"><span class="sh-info-detail__label sh-body-md">5′ 6″</span><span class="sh-info-detail__separator" aria-hidden="true"></span></span><span class="sh-info-detail sh-info-detail--on-image sh-info-detail--md"><span class="sh-info-detail__label sh-body-md">Kashmiri Pandit</span><span class="sh-info-detail__separator" aria-hidden="true"></span></span><span class="sh-info-detail sh-info-detail--on-image sh-info-detail--md"><span class="sh-info-detail__label sh-body-md">Pimpri-Chinchwad</span><span class="sh-info-detail__separator" aria-hidden="true"></span></span><span class="sh-info-detail sh-info-detail--on-image sh-info-detail--md"><span class="sh-info-detail__label sh-body-md">Software Developer</span></span></p>
            </div>
          </div>
          <div class="sh-profile-card-info__tags"><span class="sh-tag sh-tag--translucent-light sh-tag--sm sh-tag--no-border sh-tag-profile sh-tag-profile--you-and-her"><span class="sh-tag__icon sh-icon--brand sh-icon sh-icon--12" style="--icon:url(ICON/line/link-rings.svg)" aria-hidden="true"></span><span class="sh-tag__label sh-support-label">You &amp; Her</span></span><span class="sh-tag sh-tag--translucent-light sh-tag--sm sh-tag--no-border sh-tag-profile sh-tag-profile--astro"><span class="sh-tag__icon sh-icon--premium sh-icon sh-icon--12" style="--icon:url(ICON/line/astro.svg)" aria-hidden="true"></span><span class="sh-tag__label sh-support-label">Astro</span></span></div>
          <hr class="sh-divider sh-divider--soft sh-profile-card-info__divider">
          <div class="sh-action-island sh-action-island--normal sh-action-island--message-primary">
            <div class="sh-action-note sh-action-note--edit sh-action-note--normal"><span class="sh-action-note__text sh-body-sm">Hey Sneha, I came across your profile. It felt true to me.</span><span class="sh-action-note__link"><button class="sh-text-link sh-text-link--inverse sh-text-link--sm" type="button"><span class="sh-text-link__label sh-button-sm">Edit</span></button></span></div>
            <div class="sh-action-island__actions"><p class="sh-action-island__message sh-body-md-tight">Like this profile?</p><button class="sh-button sh-button--primary sh-button--md sh-button--fill" type="button"><span class="sh-button__icon sh-icon" style="--icon:url(ICON/filled/connect.svg)" aria-hidden="true"></span><span class="sh-button__text"><span class="sh-button__label sh-button-md">Connect Now</span></span></button></div>
          </div>
        </section>
      </div>
    </article>
  </div>

</div>
