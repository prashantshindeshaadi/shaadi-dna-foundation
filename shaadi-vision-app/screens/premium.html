<!-- Premium: copies Figma frame 2712:28638 "Premium plans". Status bar and navigation bar come from the app shell. -->
<div class="scr-screen">

  <header class="sh-app-header sh-app-header--back">
    <div class="sh-app-header__bar">
      <div class="sh-app-header__navigation"><button class="sh-icon-button sh-icon-button--tertiary sh-icon-button--md" type="button" aria-label="Go back"><span class="sh-icon-button__icon sh-icon" style="--icon:url(ICON/line/arrow-left.svg)" aria-hidden="true"></span></button></div>
      <h1 class="sh-app-header__title sh-title-lg">Premium</h1>
      <div class="sh-app-header__actions"><button class="sh-icon-button sh-icon-button--tertiary sh-icon-button--md" type="button" aria-label="Help"><span class="sh-icon-button__icon sh-icon" style="--icon:url(ICON/line/help-circle.svg)" aria-hidden="true"></span></button></div>
    </div>
  </header>

  <div class="scr-center scr-pad-16">
    <div class="sh-segmented-control" role="tablist" aria-label="Plan type">
      <button class="sh-tab-item sh-tab-item--segmented" type="button" role="tab" aria-selected="true"><span class="sh-tab-item__label sh-button-md">Premium</span></button>
      <button class="sh-tab-item sh-tab-item--segmented" type="button" role="tab" aria-selected="false"><span class="sh-tab-item__label sh-body-md">VIP</span></button>
    </div>
  </div>

  <aside class="sh-offer-card" aria-label="Offer">
    <!-- gap: the Money back artwork ("30 Days · MONEY BACK GUARANTEE") is vector art in Figma, not exported to the repo; neutral placeholder at its 208 × 44 size -->
    <div class="sh-offer-card__artwork"><img class="sh-offer-card__art" width="208" height="44" alt="30 days money back guarantee" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 208 44'%3E%3Crect width='208' height='44' rx='8' fill='%23CBD5E1'/%3E%3C/svg%3E"></div>
  </aside>

  <div class="scr-stack scr-pad-16 scr-gap-8">
    <article class="sh-plan-card sh-plan-card--collapsed" aria-label="Silver plan">
      <button class="sh-plan-card__head" type="button" aria-expanded="false">
        <span class="sh-plan-card__name"><span class="sh-plan-card__plan sh-title-md">Silver</span><span class="sh-plan-card__duration sh-body-sm">1 month</span></span>
        <span class="sh-plan-card__pricing"><span class="sh-plan-card__price sh-title-md">₹509</span></span>
      </button>
    </article>

    <article class="sh-plan-card sh-plan-card--gold-plus" aria-label="Gold+ plan">
      <div class="sh-plan-card__top"><span class="sh-tag"><span class="sh-tag__label sh-support-label">Popular Plan</span></span><label class="sh-plan-card__plus"><span class="sh-plan-card__plus-label sh-support-label">Plus</span><span class="sh-toggle"><input class="sh-toggle__input" type="checkbox" role="switch" checked><span class="sh-toggle__track" aria-hidden="true"><span class="sh-toggle__thumb"><span class="sh-icon sh-icon--16 sh-toggle__icon" style="--icon:url(ICON/filled/check.svg)"></span></span></span></span></label></div>
      <div class="sh-plan-card__head">
        <div class="sh-plan-card__name"><h3 class="sh-plan-card__plan sh-heading-md">Gold+</h3><span class="sh-plan-card__duration sh-body-sm">3 months</span></div>
        <div class="sh-plan-card__pricing"><span class="sh-plan-card__price sh-heading-md">₹945</span><span class="sh-plan-card__per-month"><span class="sh-body-sm">₹315/month ·</span><s class="sh-plan-card__was sh-body-sm">₹5,560</s></span><span class="sh-tag"><span class="sh-tag__label sh-support-label">Flat 83% off</span></span></div>
      </div>
      <hr class="sh-divider sh-divider--soft">
      <div class="sh-plan-card__benefits">
        <div class="sh-data-point sh-data-point--md"><span class="sh-data-point__icon-box"><span class="sh-data-point__icon sh-icon" style="--icon:url(ICON/filled/check.svg)" aria-hidden="true"></span></span><div class="sh-data-point__content"><div class="sh-data-point__row"><span class="sh-data-point__label sh-body-md">View up to 75 contact numbers</span></div><p class="sh-data-point__subtext sh-body-sm">Unlimited for Accepted Matches</p></div></div>
        <div class="sh-data-point sh-data-point--md"><span class="sh-data-point__icon-box"><span class="sh-data-point__icon sh-icon" style="--icon:url(ICON/filled/check.svg)" aria-hidden="true"></span></span><div class="sh-data-point__content"><div class="sh-data-point__row"><span class="sh-data-point__label sh-body-md">Video call &amp; chat with Matches</span></div></div></div>
        <div class="sh-data-point sh-data-point--md"><span class="sh-data-point__icon-box"><span class="sh-data-point__icon sh-icon" style="--icon:url(ICON/filled/check.svg)" aria-hidden="true"></span></span><div class="sh-data-point__content"><div class="sh-data-point__row"><span class="sh-data-point__label sh-body-md">Stand out from other Profiles</span></div></div></div>
        <div class="sh-data-point sh-data-point--md sh-data-point--excluded"><span class="sh-data-point__icon-box"><span class="sh-data-point__icon sh-icon" style="--icon:url(ICON/filled/check.svg)" aria-hidden="true"></span></span><div class="sh-data-point__content"><div class="sh-data-point__row"><span class="sh-data-point__label sh-body-md">Let Matches contact you directly</span></div></div></div>
      </div>
      <a class="sh-text-link sh-text-link--neutral sh-text-link--md" href="#benefits"><span class="sh-text-link__icon sh-icon" style="--icon:url(ICON/line/arrow-down-01.svg)" aria-hidden="true"></span><span class="sh-text-link__label sh-button-md">See all benefits</span></a>
      <div class="sh-plan-card__footer">
        <button class="sh-button sh-button--primary sh-button--lg sh-plan-card__cta" type="button"><span class="sh-button__text"><span class="sh-button__label sh-button-lg">Continue with Gold+</span></span></button>
        <div class="sh-avatar-stack"><span class="sh-avatar-stack__avatars" aria-hidden="true"><span class="sh-avatar-stack__avatar"><span class="sh-user-image"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23CBD5E1'/%3E%3Cstop offset='1' stop-color='%23475569'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' fill='url(%23g)'/%3E%3C/svg%3E" alt=""></span></span><span class="sh-avatar-stack__avatar"><span class="sh-user-image"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23CBD5E1'/%3E%3Cstop offset='1' stop-color='%23475569'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' fill='url(%23g)'/%3E%3C/svg%3E" alt=""></span></span><span class="sh-avatar-stack__avatar"><span class="sh-user-image"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23CBD5E1'/%3E%3Cstop offset='1' stop-color='%23475569'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' fill='url(%23g)'/%3E%3C/svg%3E" alt=""></span></span></span><span class="sh-avatar-stack__label sh-body-sm">Chosen by 2.1L Members</span></div>
      </div>
    </article>

    <article class="sh-plan-card sh-plan-card--collapsed sh-plan-card--diamond-plus" aria-label="Diamond+ plan">
      <button class="sh-plan-card__head" type="button" aria-expanded="false">
        <span class="sh-plan-card__name"><span class="sh-plan-card__plan sh-title-md">Diamond+</span><span class="sh-plan-card__duration sh-body-sm">6 months</span></span>
        <span class="sh-plan-card__pricing"><span class="sh-plan-card__price sh-title-md">₹1,393</span></span>
      </button>
    </article>

    <article class="sh-plan-card sh-plan-card--collapsed sh-plan-card--platinum-plus" aria-label="Platinum+ plan">
      <!-- gap: Figma puts the "Best Value" tag inline after the duration; the collapsed card only takes a tag in its top row -->
      <div class="sh-plan-card__top"><span class="sh-tag"><span class="sh-tag__label sh-support-label">Best Value</span></span></div>
      <button class="sh-plan-card__head" type="button" aria-expanded="false">
        <span class="sh-plan-card__name"><span class="sh-plan-card__plan sh-title-md">Platinum+</span><span class="sh-plan-card__duration sh-body-sm">12 months</span></span>
        <span class="sh-plan-card__pricing"><span class="sh-plan-card__price sh-title-md">₹2,261</span></span>
      </button>
    </article>

    <article class="sh-plan-card sh-plan-card--collapsed sh-plan-card--platinum-private" aria-label="Platinum Private plan">
      <button class="sh-plan-card__head" type="button" aria-expanded="false">
        <span class="sh-plan-card__name"><span class="sh-plan-card__plan sh-title-md">Platinum Private</span><span class="sh-plan-card__duration sh-body-sm">12 months</span></span>
        <span class="sh-plan-card__pricing"><span class="sh-plan-card__price sh-title-md">₹12,076</span></span>
      </button>
    </article>
  </div>

</div>
